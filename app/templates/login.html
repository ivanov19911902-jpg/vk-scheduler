<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Вход</title>
                <style>
                        body { font-family: sans-serif; background: #F8FAFC; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                                .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 320px; }
                                        h1 { margin-top: 0; font-size: 24px; text-align: center; }
                                                input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #E2E8F0; border-radius: 8px; box-sizing: border-box; }
                                                        button { width: 100%; padding: 10px; background: #4F46E5; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
                                                                .error { color: #EF4444; font-size: 14px; margin-bottom: 15px; text-align: center; }
                                                                    </style>
                                                                    </head>
                                                                    <body>
                                                                        <div class="card">
                                                                                <h1>Вход в админку</h1>
                                                                                        {% if error %}
                                                                                                <div class="error">{{ error }}</div>
                                                                                                        {% endif %}
                                                                                                                <form method="post" action="/login">
                                                                                                                            <input type="text" name="username" placeholder="Логин" required autofocus>
                                                                                                                                        <input type="password" name="password" placeholder="Пароль" required>
                                                                                                                                                    <button type="submit">Войти</button>
                                                                                                                                                            </form>
                                                                                                                                                                </div>
                                                                                                                                                                </body>
                                                                                                                                                                </html>
